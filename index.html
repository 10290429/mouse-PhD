<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鼠於你的學位</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one-screen doodle sketchbook. Header with level name and three crumb circles, a hand-drawn SVG scene, a hint bar at the thumb. Black ink, warm paper, mustard yellow as the only fill. Single theme by choice. */
:root{
  --paper:#f7f2e6; --ink:#161616; --yellow:#ecc12f; --soft:#6f6a5c; --white:#fffdf8;
  --hand:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB","BiauKai",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--hand);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:3px solid var(--ink)}
.brand{font-weight:700;font-size:19px;letter-spacing:.08em}
.lvl{font-size:13px;color:var(--soft);margin-top:2px}
.meter{display:flex;align-items:center;gap:6px;font-size:13px}
.meter i{width:20px;height:20px;border:3px solid var(--ink);border-radius:50%;display:block;background:var(--white);transition:background .3s,transform .3s}
.meter i.on{background:var(--yellow);transform:scale(1.12)}
.meter b{font-weight:700;min-width:1.4em}
.stage{flex:1;min-height:0;position:relative}
#scene{width:100%;height:100%;display:block}
[data-hit]{cursor:pointer}
.hop{animation:hop .7s ease-out}
@keyframes hop{30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.hud{border-top:3px solid var(--ink);padding-top:10px;display:flex;align-items:center;gap:12px;min-height:58px}
.hud p{margin:0;flex:1;font-size:15px;line-height:1.45;min-width:0}
.timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.timer.warn{color:var(--ink);background:var(--yellow);border-radius:8px;padding:0 6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.btn{all:unset;cursor:pointer;border:3px solid var(--ink);border-radius:999px;padding:10px 18px;font-size:16px;font-weight:700;background:var(--white);white-space:nowrap;text-align:center;min-height:22px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary::after{content:" →"}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(247,242,230,.9);z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{background:var(--white);border:3px solid var(--ink);border-radius:22px;padding:18px;width:100%;max-width:370px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.lens{width:100%;aspect-ratio:4/3;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--paper)}
.lens svg,.art svg{width:100%;height:100%;display:block}
.art{width:100%;aspect-ratio:4/3;border-radius:18px;background:var(--paper);overflow:hidden}
.sheet h2{margin:0;font-size:28px;letter-spacing:.08em;text-wrap:balance}
.sheet h3{margin:0;font-size:21px}
.sheet p{margin:0;font-size:15px;line-height:1.7}
.eyebrow{font-size:13px;letter-spacing:.2em;color:var(--soft)}
.tag{align-self:flex-start;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.note{border:3px solid var(--ink);border-radius:16px;background:var(--yellow);padding:12px 14px;display:flex;flex-direction:column;gap:6px;transform:rotate(-1deg)}
.note.clean{background:var(--paper)}
.note-head{font-weight:700;font-size:15px;letter-spacing:.06em}
.note p{margin:0;font-size:14px;line-height:1.6;padding-left:18px;position:relative}
.note p::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.acts{display:flex;gap:10px}
.acts .btn{flex:1}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:999px;font-size:14px;max-width:92%;text-align:center;pointer-events:none;transition:opacity .3s;opacity:0;z-index:3}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.hop,.timer.warn{animation:none}.btn:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="brand">鼠於你的學位</div><div class="lvl" id="lvl">準備出門</div></div>
    <div class="meter" aria-label="屑屑計量"><span>屑屑</span><i></i><i></i><i></i><b id="extra"></b></div>
  </header>
  <div class="stage">
    <svg id="scene" viewBox="0 0 360 460" preserveAspectRatio="xMidYMid meet" aria-label="遊戲場景">
      <defs>
        <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1"/>
          <feDisplacementMap in="SourceGraphic" scale="1.8"/>
        </filter>
      </defs>
      <g id="world" filter="url(#wob)" stroke="#161616" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></g>
    </svg>
    <div class="toast" id="toast"></div>
  </div>
  <div class="hud">
    <p id="hint">點開始，準備出門。</p>
    <span class="timer" id="timer"></span>
    <button class="btn primary" id="act" hidden></button>
  </div>
</div>

<div class="ov" id="lensOv" hidden>
  <div class="sheet">
    <div class="lens" id="lensBox"><svg id="lensSvg" viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice"><use href="#world"/></svg></div>
    <div class="art" id="artBox" hidden></div>
    <h3 id="lensTitle"></h3>
    <p id="lensText"></p>
    <div class="acts" id="lensActs"></div>
  </div>
</div>

<div class="ov" id="cardOv">
  <div class="sheet">
    <div class="art" id="cardArt"></div>
    <div class="eyebrow" id="cardEye">研究生的一天</div>
    <h2 id="cardTitle">鼠於你的學位</h2>
    <div class="note" id="cardNote" hidden><div class="note-head" id="noteHead"></div><div id="noteBody"></div></div>
    <p id="cardBody"></p>
    <button class="btn primary" id="cardBtn">開始收包包</button>
  </div>
</div>

<script>
(function(){
const INK="#161616",Y="#ecc12f",W="#fffdf8",P="#f7f2e6";
const $=id=>document.getElementById(id);
const world=$("world");
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mul(Date.now());
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- drawing helpers ---------- */
const T=(x,y,s,txt,extra="")=>`<text x="${x}" y="${y}" font-size="${s}" stroke="none" fill="${INK}" font-family="LXGW WenKai TC, Kaiti TC, STKaiti, serif" ${extra}>${txt}</text>`;
/* crumbs: a scatter of uneven black bits, big chunks and fine dust */
function crumbs(x,y,n=6,s=6,seed=1,k=1){const r=mul(seed*9973+Math.round(x)*31+Math.round(y));let o="";
  for(let i=0;i<n;i++){const a=r()*6.283,d=Math.sqrt(r())*s,cx=x+Math.cos(a)*d,cy=y+Math.sin(a)*d,big=r()<.3,sz=(big?1.6+r()*1.6:0.5+r()*0.8)*k;
    if(big){let p="";const m=5+Math.floor(r()*3);for(let j=0;j<m;j++){const t=j/m*6.283,rr=sz*(.6+r()*.6);p+=(j?"L":"M")+(cx+Math.cos(t)*rr).toFixed(1)+" "+(cy+Math.sin(t)*rr).toFixed(1)}
      o+=`<path d="${p}Z" fill="${INK}" stroke="none"/>`}
    else o+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${sz.toFixed(2)}" fill="${INK}" stroke="none"/>`}return o}
function doodles(seed,areas){const r=mul(seed);let o="";
  areas.forEach(([x,y,w,h,n])=>{for(let i=0;i<n;i++){const px=x+r()*w,py=y+r()*h,k=r();
    if(k<.35)o+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="1.6" fill="${INK}" stroke="none"/>`;
    else if(k<.6)o+=`<path d="M${(px-4).toFixed(1)} ${py.toFixed(1)}h8M${px.toFixed(1)} ${(py-4).toFixed(1)}v8" stroke-width="1.8"/>`;
    else if(k<.85){const a=r()*3.14;o+=`<path d="M${px.toFixed(1)} ${py.toFixed(1)}l${(Math.cos(a)*7).toFixed(1)} ${(Math.sin(a)*7).toFixed(1)}" stroke-width="2"/>`}
    else o+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="${Y}" stroke-width="1.6"/>`}});
  return o}
const hitRect=(id,x,y,w,h)=>`<rect data-hit="${id}" x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="none" pointer-events="all"/>`;

/* the mouse: one-line doodle, facing right, origin at its feet */
function rat(x,y,o={}){
  const s=o.s||1,c=o.c!=null?o.c:G.crumbs,f=o.flip?-1:1;
  let g=`<g class="${o.hop?"hop":""}"><g transform="translate(${x} ${y}) scale(${f*s} ${s})">`;
  g+=`<path d="M-13 -3 C-27 1 -28 -14 -17 -13 C-10 -12 -12 -5 -17 -6" stroke-width="2.2"/>`;
  g+=`<ellipse cx="-3" cy="-33" rx="5.5" ry="5" fill="${W}" stroke-width="2.2"/><ellipse cx="4.5" cy="-37" rx="4.5" ry="5.5" fill="${W}" stroke-width="2.2"/>`;
  g+=`<path d="M-13 0 C-20 -16 -10 -31 5 -31 L20 -21 Q13 -19 11 -16 L11 0 Z" fill="${o.fill||W}" stroke-width="2.4"/>`;
  g+=`<path d="M-8 -3 C-10 -12 -2 -15 1 -8" stroke-width="1.8"/>`;
  g+=`<circle cx="20" cy="-21" r="1.9" fill="${INK}" stroke="none"/>`;
  g+=c===0&&!o.awake?`<path d="M6 -24 q2.5 2.5 5 0" stroke-width="1.6"/>`+T(14,-34,8,"z"):`<circle cx="8.5" cy="-24" r="1.5" fill="${INK}" stroke="none"/>`;
  if(c>=1||o.glasses)g+=`<circle cx="8.5" cy="-24" r="4.2" fill="none" stroke-width="1.5"/><path d="M4.3 -24.5 L0 -26" stroke-width="1.3"/>`;
  if(c>=2||o.book)g+=`<rect x="7" y="-16" width="11" height="13" rx="1" fill="${Y}" stroke-width="1.8"/><path d="M12.5 -16v13" stroke-width="1.2"/>`;
  if(c>=3&&!o.cap)g+=`<rect x="-11" y="-25" width="15" height="9" rx="1" fill="${Y}" stroke-width="1.4"/>`+T(-9.5,-18.5,5,"准考證");
  if(o.cap)g+=`<path d="M-6 -39 l11 -5 l11 5 l-11 5z" fill="${INK}" stroke-width="1.6"/><path d="M16 -39 v8" stroke-width="1.4"/><circle cx="16" cy="-30" r="1.8" fill="${Y}" stroke-width="1.2"/>`;
  return g+`</g></g>`;
}
function rats(list){return list.map((r,i)=>rat(r[0],r[1],{flip:r[2],s:r[3]||1,hop:G.hop===i})).join("")}

/* item art, centred on 0,0 */
const ART={
  laptop:()=>`<rect x="-29" y="-20" width="58" height="37" rx="4" fill="${W}"/><rect x="-23" y="-14" width="46" height="18" rx="2" fill="${Y}" stroke-width="2"/><path d="M-21 10h42M-21 13.5h42" stroke-width="1.4"/>`,
  card:()=>`<rect x="-26" y="-17" width="52" height="34" rx="4" fill="${Y}"/><rect x="-20" y="-10" width="13" height="16" fill="${W}" stroke-width="1.8"/><circle cx="-13.5" cy="-4" r="3" stroke-width="1.4"/>`+T(-3,-3,8,"借書證")+`<path d="M-3 5h20M-3 9.5h13" stroke-width="1.4"/>`,
  thesis:t=>`<rect x="-19" y="-21" width="40" height="44" fill="${W}" transform="rotate(-6)"/><rect x="-22" y="-23" width="40" height="44" fill="${W}"/>`+T(-17,-11,7.5,"論文初稿")+`<path d="M-17 -2h29M-17 3h29M-17 8h20M-17 13h25" stroke-width="1.3"/>`+(t?`<path d="M14 9 q6 -6 11 2 q-3 -1 -6 1" stroke-width="1.6" fill="${Y}"/>`+crumbs(22,17,5,4,3):""),
  coat:t=>`<path d="M-28 -16 l12 -7 h32 l12 7 v38 h-56z" fill="${W}"/><path d="M0 -23v45" stroke-width="2"/><path d="M-8 -23 l8 9 l8 -9" stroke-width="1.8"/><rect x="6" y="4" width="16" height="13" stroke-width="1.8" fill="${W}"/>`+(t?`<path d="M8 4 l1.5 -5 2 3 2 -3.5 2 3 2 -3.5 1.5 6" stroke-width="1.4" fill="${Y}"/>`:""),
  bottle:()=>`<rect x="-9" y="-13" width="18" height="34" rx="6" fill="${Y}"/><rect x="-7" y="-22" width="14" height="9" rx="2" fill="${W}"/><path d="M-9 0h18M-9 8h18" stroke-width="1.4"/>`,
  cup:t=>`<rect x="-10" y="-12" width="20" height="33" rx="5" fill="${W}"/><rect x="-11" y="-20" width="22" height="8" rx="3" fill="${W}"/><rect x="-7" y="-2" width="14" height="11" stroke-width="1.4" fill="${Y}"/>`+(t?T(-6,4,5.5,"珍奶"):T(-6,5,5.5,"熱水")),
  pouch:t=>`<rect x="-28" y="-11" width="56" height="22" rx="11" fill="${W}"/><path d="M-20 -11 h40" stroke-width="1.6" stroke-dasharray="2 3"/><circle cx="22" cy="-11" r="2.4" stroke-width="1.4"/>`+(t?`<path d="M-2 -13 l-5 -4 v7z M-2 -13 h5 M3 -13 l5 -4 v7z" stroke-width="1.3" fill="${Y}"/>`:""),
  ear:()=>`<path d="M-15 6 a15 15 0 0 1 30 0" stroke-width="3"/><rect x="-21" y="2" width="10" height="16" rx="4" fill="${Y}"/><rect x="11" y="2" width="10" height="16" rx="4" fill="${Y}"/>`,
  note:()=>`<rect x="-20" y="-23" width="40" height="46" rx="3" fill="${W}"/>`+[-14,-7,0,7,14].map(x=>`<circle cx="${x}" cy="-23" r="2" stroke-width="1.4"/>`).join("")+`<path d="M-14 -10h28M-14 -3h28M-14 4h28M-14 11h20" stroke-width="1.3"/>`,
  charger:()=>`<rect x="-11" y="-10" width="22" height="22" rx="5" fill="${W}"/><path d="M-5 -10v-6M5 -10v-6" stroke-width="2.6"/><path d="M0 12 q4 14 18 8 q10 -4 6 -14" stroke-width="2"/>`
};

/* ---------- state ---------- */
let G;
function newGame(){rnd=mul(Date.now());G={lv:-1,crumbs:0,hop:-1,bag:new Set(),msgs:[],log:[]};meter()}
function meter(){document.querySelectorAll(".meter i").forEach((e,i)=>e.classList.toggle("on",i<G.crumbs));$("extra").textContent=G.crumbs>3?`+${G.crumbs-3}`:""}
function addCrumb(reason,quiet){
  G.crumbs++;G.msgs.push(reason);G.log.push(reason);meter();
  if(quiet)return;
  G.hop=Math.floor(rnd()*4);draw();toast("屑屑加一！"+reason);
  setTimeout(()=>{G.hop=-1;draw()},750);
}
let tt;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2300)}
function draw(){if(G.lv>=0&&LV[G.lv])world.innerHTML=LV[G.lv].draw()}
function hint(t){$("hint").textContent=t}
function act(label,fn,disabled=false){const b=$("act");if(!label){b.hidden=true;return}b.hidden=false;b.textContent=label;b.disabled=disabled;b.onclick=fn}

let ti=null;
function startTimer(sec,onEnd){stopTimer();G.time=sec;const el=$("timer");el.textContent=sec;el.classList.remove("warn");
  ti=setInterval(()=>{G.time--;el.textContent=Math.max(0,G.time);if(G.time<=10)el.classList.add("warn");if(G.time<=0){stopTimer();closeLens();onEnd()}},1000)}
function stopTimer(){clearInterval(ti);ti=null}
function clearTimer(){stopTimer();$("timer").textContent="";$("timer").classList.remove("warn")}

const svgWrap=(vb,inner)=>`<svg viewBox="${vb}"><g filter="url(#wob)" stroke="${INK}" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
function openLens({crop,art,title,text,actions}){
  if(crop){$("lensBox").hidden=false;$("artBox").hidden=true;$("lensSvg").setAttribute("viewBox",crop.join(" "))}
  else{$("lensBox").hidden=true;$("artBox").hidden=false;$("artBox").innerHTML=svgWrap("0 0 160 120",art)}
  $("lensTitle").textContent=title;$("lensText").textContent=text;
  const a=$("lensActs");a.innerHTML="";
  actions.forEach(x=>{const b=document.createElement("button");b.className="btn"+(x.primary?" primary":"");b.textContent=x.label;b.onclick=()=>{closeLens();x.fn&&x.fn()};a.appendChild(b)});
  $("lensOv").hidden=false;
}
function closeLens(){$("lensOv").hidden=true}
function card({eye,title,body,btn,art,fn,note}){
  $("cardEye").textContent=eye;$("cardTitle").textContent=title;$("cardBody").innerHTML=body;
  const nb=$("cardNote");if(note){nb.hidden=false;nb.classList.toggle("clean",!note.lines.length);$("noteHead").textContent=note.head;
    $("noteBody").innerHTML=(note.lines.length?note.lines:[note.empty]).map(t=>`<p>${t}</p>`).join("")}else nb.hidden=true;
  const a=$("cardArt");if(art){a.hidden=false;a.innerHTML=svgWrap("0 0 320 240",art)}else a.hidden=true;
  $("cardBtn").textContent=btn;$("cardBtn").onclick=()=>{$("cardOv").hidden=true;fn()};$("cardOv").hidden=false;
}
function goto(n){
  clearTimer();act(null);
  const note=G.lv>=0?{head:G.msgs.length?`上一關你留下了 ${G.msgs.length} 份屑屑`:"上一關沒有留下屑屑",lines:G.msgs.map(m=>"哎呀，"+m+"。"),empty:"乾乾淨淨，老鼠還在角落打呼。"}:null;
  G.msgs=[];const L=LV[n];
  card({eye:`第 ${n+1} 關，共 3 關`,title:L.name,note,body:L.brief,btn:"開始",art:L.cover(),
    fn:()=>{G.lv=n;$("lvl").textContent=`第 ${n+1} 關 ${L.name}`;L.start();draw()}});
}

/* ---------- level data ---------- */
const ITEMS=[
  {id:"laptop",name:"筆電",look:"每天都離不開的筆電，今天一定要帶。"},
  {id:"card",name:"借書證",look:"沒有它進不了圖書館。"},
  {id:"thesis",name:"論文初稿",look:"早上邊吃早餐邊改的那一份。",trap:"論文初稿裡夾著早餐的可頌碎片，你一翻開就掉了滿桌"},
  {id:"coat",name:"外套",look:"昨天穿的外套，圖書館冷氣很強。",trap:"外套口袋裡那半包餅乾你沒發現，走一步掉一點"},
  {id:"bottle",name:"水壺",look:"多喝水總是好的。"},
  {id:"cup",name:"保溫杯",look:"早上出門前裝好的。",trap:"保溫杯裡裝的其實是珍奶，蓋子一開珍珠就滾出來了"},
  {id:"pouch",name:"筆袋",look:"每天都會用到的筆袋。",trap:"筆袋裡藏著一顆拆開的糖果，糖粉撒得到處都是"},
  {id:"ear",name:"耳機",look:"閱覽室很安靜，戴不戴都可以。"},
  {id:"note",name:"筆記本",look:"上次討論的筆記都在裡面。"},
  {id:"charger",name:"充電器",look:"筆電沒電就完了。"}
];
/* zoomed-in detail of each item, drawn for a 160 x 120 lens */
const ring=`<circle cx="80" cy="60" r="56" fill="none" stroke-width="2" stroke-dasharray="3 6"/>`;
const DETAIL={
  laptop:()=>`<g transform="translate(80 58) scale(2)">${ART.laptop()}</g>`+`<path d="M44 92h72" stroke-width="1.6"/>`,
  card:()=>`<g transform="translate(80 60) scale(2.2)">${ART.card()}</g>`,

/* reading room: 3 tables, each with one pair of empty seats next to a neighbour */
const TY=[76,196,316],CX=[58,138,222,302];
function seatLayout(){
  const seats=[];const hair=shuffle([0,1,2,3,0,1]);let k=0;
  TY.forEach((ty,r)=>{const pat=rnd()<.5?"PEEP":"EPPE";
    [...pat].forEach((ch,c)=>{seats.push({r,c,x:CX[c],y:ty+70,empty:ch==="E"})});});
  seats.forEach(s=>{if(!s.empty)s.hair=hair[k++%6]});
  const empties=seats.filter(s=>s.empty);
  empties.forEach(e=>{const row=seats.filter(s=>s.r===e.r&&!s.empty);e.nb=row.reduce((a,b)=>Math.abs(b.c-e.c)<Math.abs(a.c-e.c)?b:a)});
  const neighbours=seats.filter(s=>!s.empty);shuffle(neighbours).slice(0,2).forEach(n=>n.snack=true);
  return seats;
}
function person(s,reveal){
  const {x,y}=s;let o=`<path d="M${x-20} ${y+16} q20 -26 40 0z" fill="${W}"/>`;
  o+=`<circle cx="${x}" cy="${y-4}" r="12" fill="${W}"/>`;
  o+=[`<path d="M${x-12} ${y-6} q12 -16 24 0 q-12 -6 -24 0z" fill="${INK}"/>`,
      `<path d="M${x-12} ${y-4} q12 -20 24 0" stroke-width="2"/><circle cx="${x}" cy="${y-18}" r="5" fill="${INK}" stroke="none"/>`,
      `<path d="M${x-13} ${y-6} q13 -14 26 0z" fill="${Y}"/><path d="M${x+11} ${y-6} h7" stroke-width="2.6"/>`,
      `<path d="M${x-12} ${y-4} q12 -18 24 0 v12 M${x-12} ${y-4} v12" stroke-width="2.4"/>`][s.hair];
  if(reveal&&s.snack)o+=`<path d="M${x+14} ${y-20} l3 -4 3 4 3 -4 3 4 3 -4 v20 h-15z" fill="${Y}" stroke-width="2"/>`+T(x+15,y-6,5.5,"洋芋片")+crumbs(x+22,y+8,10,10,x+y);
  if(reveal&&!s.snack)o+=`<rect x="${x+10}" y="${y-16}" width="16" height="12" fill="${W}" stroke-width="1.8"/><path d="M${x+18} ${y-16}v12" stroke-width="1.2"/>`;

}
